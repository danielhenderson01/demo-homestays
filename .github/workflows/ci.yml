name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  cdk:
    name: CDK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cdk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: CDK synth
        env:
          hs_stripe_secret_arn: arn:aws:secretsmanager:us-east-1:000000000000:secret:example-stripe-HInwGX
          hs_db_secret_arn: arn:aws:secretsmanager:us-east-1:000000000000:secret:example-db-HJnyGX
          hs_ecr_repo_uri: 000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/homestays-repo
          hs_db_name: db
          hs_cloud_env: localstack
          hs_aws_region: us-east-1
          hs_aws_s3_presign_duration: 10
          hs_aws_s3_sample_prefix: images/samples
          hs_spring_profiles_active: dev

        run: npx cdk synth
