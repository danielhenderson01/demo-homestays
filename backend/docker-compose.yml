services:
  db:
    image: postgres
    ports:
      - "5002:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d db" ]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: always
    env_file: ".env"

  server:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4002:4002"
    env_file: ".env"
